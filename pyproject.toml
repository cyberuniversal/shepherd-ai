[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shepherd-ai"
version = "0.1.0"
description = "Research prototype foundation for natural-language multi-drone mission planning in simulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
speech = ["openai-whisper"]

[tool.setuptools.packages.find]
where = ["src"]
