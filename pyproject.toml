[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shepherd-ai"
version = "0.1.0"
description = "Research prototype foundation for natural-language multi-drone mission planning in simulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "folium>=0.16",
    "networkx>=3.0",
]

[project.optional-dependencies]
vision = [
    "pillow>=10",
    "ultralytics>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
