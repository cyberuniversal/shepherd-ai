apiVersion: batch/v1
kind: Job
metadata:
  name: shepherd-ai-smoke-models
  namespace: aiea-interns
  labels:
    app.kubernetes.io/name: shepherd-ai
    shepherd-ai/stage: smoke
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shepherd-ai
        shepherd-ai/stage: smoke
    spec:
      priorityClassName: opportunistic
      restartPolicy: Never
      containers:
        - name: smoke-models
          image: pytorch/pytorch:2.7.1-cuda11.8-cudnn9-runtime
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends git ca-certificates
              rm -rf /var/lib/apt/lists/*
              repo="/workspace/repo-${SHEPHERD_GIT_COMMIT}"
              git -C "${repo}" checkout --detach "${SHEPHERD_GIT_COMMIT}"
              python -m pip install --no-cache-dir -e "${repo}[multiuav-inference]"
              python "${repo}/scripts/smoke_multiuav_qwen.py" \
                --cache-audit /workspace/artifacts/qwen25_3b_cache_audit_nautilus_v1.json \
                --output /workspace/artifacts/qwen25_3b_load_smoke_nautilus_v1.json \
                --dtype float16 \
                --device-map auto \
                --max-new-tokens 1
              python "${repo}/scripts/smoke_multiuav_qwen.py" \
                --cache-audit /workspace/artifacts/qwen25_7b_cache_audit_nautilus_v1.json \
                --output /workspace/artifacts/qwen25_7b_load_smoke_nautilus_v1.json \
                --dtype float16 \
                --device-map auto \
                --max-new-tokens 1
          env:
            - name: SHEPHERD_GIT_COMMIT
              value: __SHEPHERD_GIT_COMMIT__
            - name: HF_HOME
              value: /workspace/hf-cache
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
              nvidia.com/a100: "1"
            limits:
              cpu: "4"
              memory: 32Gi
              nvidia.com/a100: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: shepherd-ai-539948
