apiVersion: batch/v1
kind: Job
metadata:
  name: shepherd-ai-cache-models
  namespace: aiea-interns
  labels:
    app.kubernetes.io/name: shepherd-ai
    shepherd-ai/stage: cache
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shepherd-ai
        shepherd-ai/stage: cache
    spec:
      priorityClassName: opportunistic
      restartPolicy: Never
      containers:
        - name: cache-models
          image: python:3.12-slim
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends git ca-certificates
              rm -rf /var/lib/apt/lists/*
              repo="/workspace/repo-${SHEPHERD_GIT_COMMIT}"
              if [[ ! -d "${repo}/.git" ]]; then
                git clone https://github.com/cyberuniversal/shepherd-ai.git "${repo}"
              fi
              git -C "${repo}" fetch origin
              git -C "${repo}" checkout --detach "${SHEPHERD_GIT_COMMIT}"
              python -m pip install --no-cache-dir -e "${repo}" "huggingface-hub>=0.26,<1"
              mkdir -p /workspace/artifacts /workspace/hf-cache
              python "${repo}/scripts/cache_multiuav_qwen.py" \
                --model-id Qwen/Qwen2.5-3B-Instruct \
                --cache-dir /workspace/hf-cache \
                --output /workspace/artifacts/qwen25_3b_cache_audit_nautilus_v1.json \
                --max-workers 4
              python "${repo}/scripts/cache_multiuav_qwen.py" \
                --model-id Qwen/Qwen2.5-7B-Instruct \
                --cache-dir /workspace/hf-cache \
                --output /workspace/artifacts/qwen25_7b_cache_audit_nautilus_v1.json \
                --max-workers 4
          env:
            - name: SHEPHERD_GIT_COMMIT
              value: __SHEPHERD_GIT_COMMIT__
            - name: HF_HOME
              value: /workspace/hf-cache
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "2"
              memory: 8Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: shepherd-ai-539948
