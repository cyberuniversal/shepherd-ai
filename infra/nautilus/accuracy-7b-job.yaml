apiVersion: batch/v1
kind: Job
metadata:
  name: shepherd-ai-accuracy-7b
  namespace: aiea-interns
  labels:
    app.kubernetes.io/name: shepherd-ai
    shepherd-ai/stage: accuracy-7b
spec:
  activeDeadlineSeconds: 604800
  backoffLimit: 20
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
            status: "True"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shepherd-ai
        shepherd-ai/stage: accuracy-7b
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-A10
                      - NVIDIA-L4
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - NVIDIA-RTX-A5000
                      - NVIDIA-RTX-5000-Ada-Generation
                      - NVIDIA-TITAN-RTX
                      - Quadro-RTX-6000
                      - Tesla-V100-SXM2-32GB
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-3090
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      containers:
        - name: accuracy-7b
          image: pytorch/pytorch:2.7.1-cuda11.8-cudnn9-runtime
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends git ca-certificates
              rm -rf /var/lib/apt/lists/*
              repo="/workspace/repo-${SHEPHERD_GIT_COMMIT}"
              if [[ ! -d "${repo}/.git" ]]; then
                git clone https://github.com/cyberuniversal/shepherd-ai.git "${repo}"
              fi
              git -C "${repo}" fetch origin
              git -C "${repo}" checkout --detach "${SHEPHERD_GIT_COMMIT}"
              python -m pip install --no-cache-dir -e "${repo}[multiuav-inference]"
              output=/workspace/results/qwen25-7b
              mkdir -p "${output}"
              python "${repo}/scripts/run_multiuav_accuracy.py" \
                --model-id Qwen/Qwen2.5-7B-Instruct \
                --cache-audit /workspace/artifacts/qwen25_7b_cache_audit_nautilus_v1.json \
                --smoke-audit /workspace/artifacts/qwen25_7b_load_smoke_nautilus_v1.json \
                --results "${output}/results.jsonl" \
                --checkpoint-zip "${output}/checkpoint.zip" \
                --run-summary "${output}/run_summary.json" \
                --progress-every-rows 10 \
                --compact-every-rows 250
          env:
            - name: SHEPHERD_GIT_COMMIT
              value: __SHEPHERD_GIT_COMMIT__
            - name: HF_HOME
              value: /workspace/hf-cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          resources:
            requests:
              cpu: "2"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: shepherd-ai-539948
