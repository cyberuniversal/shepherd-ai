    spec:
      containers:
      - args:
        - |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          repo="/workspace/repo-${SHEPHERD_GIT_COMMIT}"
          if [[ ! -d "${repo}/.git" ]]; then
            git clone https://github.com/cyberuniversal/shepherd-ai.git "${repo}"
          fi
          git -C "${repo}" fetch origin
          git -C "${repo}" checkout --detach "${SHEPHERD_GIT_COMMIT}"
          python -m pip install --no-cache-dir -e "${repo}[multiuav-inference]"
          python -m pip install --no-cache-dir \
            accelerate==1.14.0 \
            huggingface-hub==0.36.2 \
            safetensors==0.8.0 \
            transformers==4.57.6 \
            nvidia-ml-py==13.610.43 \
            psutil==7.2.0
          output=/workspace/results/resource-v1-attempt2
          mkdir -p "${output}"
          python "${repo}/scripts/run_multiuav_resource_campaign.py" \
            --output-root "${output}" \
            --node-name "${SHEPHERD_NODE_NAME}" \
            --cache-audit-root /workspace/artifacts
