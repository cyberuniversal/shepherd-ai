          import json
          from pathlib import Path
          import sys

          audit = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "model_id": "Qwen/Qwen2.5-3B-Instruct",
              "revision": "aa8e72537993ba99e69dfaafa59ed015b17504d1",
              "weights_cached": True,
              "model_invoked": False,
              "study_cases_evaluated": False,
          }
          for key, value in expected.items():
              if audit.get(key) != value:
                  raise ValueError(f"existing 3B audit has invalid {key}")
          snapshot = Path(audit["snapshot_dir"])
          for row in audit["files"]:
              path = snapshot / row["path"]
              if not path.is_file() or path.stat().st_size != row["bytes"]:
                  raise ValueError(f"existing 3B cache file is absent or truncated: {path}")
          print("Reusing the existing 3B checksum audit; full re-hash remains required at smoke.")
          PY
