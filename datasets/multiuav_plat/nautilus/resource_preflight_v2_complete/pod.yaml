spec:
  containers:
  - args:
    - |
      set -euo pipefail
      apt-get update
      apt-get install -y --no-install-recommends git ca-certificates
      rm -rf /var/lib/apt/lists/*
      repo="/workspace/repo-${SHEPHERD_GIT_COMMIT}"
      if [[ ! -d "${repo}/.git" ]]; then
        git clone https://github.com/cyberuniversal/shepherd-ai.git "${repo}"
      fi
      git -C "${repo}" fetch origin
      git -C "${repo}" checkout --detach "${SHEPHERD_GIT_COMMIT}"
      python -m pip install --no-cache-dir -e "${repo}[multiuav-inference]"
      python -m pip install --no-cache-dir \
        accelerate==1.14.0 \
        huggingface-hub==0.36.2 \
        safetensors==0.8.0 \
        transformers==4.57.6 \
        nvidia-ml-py==13.610.43 \
        psutil==7.2.0
      output=/workspace/results/resource-v2-preflight
      mkdir -p "${output}"
      mkdir -p "${output}/3b" "${output}/7b"
      python "${repo}/scripts/run_multiuav_resource.py" \
        --repetition 1 \
        --condition-order 1 \
        --cache-audit /workspace/artifacts/qwen25_3b_cache_audit_nautilus_v1.json \
        --smoke-audit /workspace/artifacts/qwen25_3b_load_smoke_nautilus_v1.json \
        --results "${output}/3b/unused-results.jsonl" \
        --checkpoint-zip "${output}/3b/unused-checkpoint.zip" \
        --run-summary "${output}/3b/run_summary.json" \
        --start-control-dir "${output}/3b/start-controls" \
        --hardware-lock "${output}/3b/unused-hardware-lock.json" \
        --node-name "${SHEPHERD_NODE_NAME}" \
        --preflight-only
      python "${repo}/scripts/run_multiuav_resource.py" \
        --repetition 1 \
        --condition-order 3 \
        --cache-audit /workspace/artifacts/qwen25_7b_cache_audit_nautilus_v1.json \
        --smoke-audit /workspace/artifacts/qwen25_7b_load_smoke_nautilus_v1.json \
        --results "${output}/7b/unused-results.jsonl" \
        --checkpoint-zip "${output}/7b/unused-checkpoint.zip" \
        --run-summary "${output}/7b/run_summary.json" \
        --start-control-dir "${output}/7b/start-controls" \
        --hardware-lock "${output}/7b/unused-hardware-lock.json" \
        --node-name "${SHEPHERD_NODE_NAME}" \
        --preflight-only
    command:
    - /bin/bash
    - -lc
    env:
    - name: SHEPHERD_GIT_COMMIT
      value: a1de91f9cabaf9f7edd25963bef0d00c7bebb267
